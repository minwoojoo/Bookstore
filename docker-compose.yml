version: '3.8'

services:
  # MySQL 데이터베이스
  mysql:
    image: mysql:8.0
    container_name: bookstore-mysql
    environment:
      MYSQL_DATABASE: bookstore
      MYSQL_USER: bookstore
      MYSQL_PASSWORD: bookstore123
      MYSQL_ROOT_PASSWORD: root123
      TZ: Asia/Seoul
    ports:
      - "33006:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - bookstore-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Spring Boot 애플리케이션
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookstore-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bookstore?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: bookstore
      SPRING_DATASOURCE_PASSWORD: bookstore123
    ports:
      - "8080:8080"
    networks:
      - bookstore-network
    volumes:
      - ./logs:/app/logs

networks:
  bookstore-network:
    driver: bridge

volumes:
  mysql-data:

